<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">AI Automation Starter Kit</title>
  <desc id="desc">A modular Python toolkit for AI automations, agents, APIs, and data workflows.</desc>
  <defs>
    <linearGradient id="background" x1="42" y1="30" x2="1364" y2="412" gradientUnits="userSpaceOnUse">
      <stop stop-color="#10172D"/>
      <stop offset=".55" stop-color="#122541"/>
      <stop offset="1" stop-color="#102B3D"/>
    </linearGradient>
    <linearGradient id="accent" x1="122" y1="140" x2="800" y2="376" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5EEAD4"/>
      <stop offset=".55" stop-color="#5BBDF6"/>
      <stop offset="1" stop-color="#A78BFA"/>
    </linearGradient>
    <linearGradient id="orb" x1="1040" y1="71" x2="1328" y2="364" gradientUnits="userSpaceOnUse">
      <stop stop-color="#2F547A" stop-opacity=".72"/>
      <stop offset="1" stop-color="#473A78" stop-opacity=".35"/>
